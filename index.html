@media(prefers-color-scheme:dark){:root{--bg:#0d1520;--card:#162233;--ink:#e8eef6;--muted:#9aabbf;--line:#26374c;--soft:#1d2d42;--btn:#2f6f9f;--acc:#6fb1e4;--ok:#4cc38a;--okbg:#143428;--warm:#a5b6ca;--warmbg:#1d2d42;--work:#8fc4ee;--workbg:#17314a}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}
header{background:linear-gradient(90deg,rgba(20,43,69,.94) 0%,rgba(20,43,69,.72) 55%,rgba(20,43,69,.38) 100%),var(--hero) center 42%/cover,linear-gradient(135deg,var(--navy),var(--blue));color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45);padding:calc(18px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 16px max(16px,env(safe-area-inset-left))}
.w{max-width:760px;margin:0 auto}
.kick{font-size:13px;font-weight:700;opacity:.8}
h1{font-size:26px;margin:4px 0 0;letter-spacing:-.02em;line-height:1.15}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{border:1px solid rgba(255,255,255,.3);background:rgba(10,24,40,.5);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:600}
.sig{margin-top:8px;font-size:12px;opacity:.85}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 8px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);padding:0 14px;min-height:44px;border-radius:12px;font-size:14px;font-weight:700;white-space:nowrap}
.tab[aria-selected=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
@media(prefers-color-scheme:dark){.tab[aria-selected=true]{background:var(--gold);color:#142b45;border-color:var(--gold)}}
.prog{display:flex;align-items:center;gap:10px;padding:0 14px 10px;max-width:760px;margin:0 auto}
.prog[hidden]{display:none}
.ring{--p:0%;width:40px;height:40px;flex:none;border-radius:50%;background:conic-gradient(var(--gold) var(--p),var(--line) 0);display:grid;place-items:center;position:relative;transition:background .4s}
.ring:before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.ring b{position:relative;font-size:11px;font-variant-numeric:tabular-nums}
.pt{flex:1;min-width:0}
.pt strong{display:block;font-size:14px}
.pt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{max-width:760px;margin:0 auto;padding:14px 14px 20px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:2px 2px 12px}
.eb{font-size:13px;color:var(--acc);font-weight:700}
h2{font-size:22px;margin:2px 0 0;letter-spacing:-.02em;color:var(--ink)}
.sm{font-size:13px;color:var(--muted);font-weight:650;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.card.cur{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent)}
.t2{display:flex;align-items:center;gap:12px}
.num{width:34px;height:34px;border-radius:10px;background:var(--soft);display:grid;place-items:center;font-weight:800;flex:none}
.nm{flex:1;min-width:0;font-weight:750;font-size:16px;margin:0;line-height:1.25}
.tag{font-size:12px;font-weight:700;color:var(--muted);background:var(--soft);padding:4px 9px;border-radius:99px;white-space:nowrap}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px;min-height:56px}
.row.done{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.row.done .num{background:transparent;color:var(--ok);font-size:18px}
.row.done .sm{color:var(--ok)}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.dot{min-width:32px;height:28px;padding:0 8px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--warmbg);color:var(--warm)}
.dot.w{background:var(--workbg);color:var(--work)}
.dot.ok{background:var(--ok);color:#fff}
.dot.on{outline:2px solid var(--gold);outline-offset:1px}
.step{border-radius:14px;padding:14px;background:var(--warmbg)}
.step.w{background:var(--workbg)}
.step h4{margin:0;font-size:18px}
.step p{margin:4px 0 12px;color:var(--muted);font-size:14px}
.in{display:grid;gap:8px;margin-bottom:12px}
.in label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:3px}
.in select#op{font-size:16px;text-align:left;padding:0 12px}
.eqs{display:flex;gap:6px;margin-top:8px}
.in>div{min-width:0}
.opb{box-sizing:border-box;max-width:100%;display:flex;align-items:center;gap:8px;width:100%;min-height:50px;padding:0 10px 0 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:700 16px/1.2 system-ui,sans-serif;text-align:left;cursor:pointer}
.opb .opn{flex:1;min-width:0;padding:8px 0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2}
.opb svg{flex:none;color:var(--muted)}
.opb.emp .opn{color:var(--muted);font-weight:600}
.opb:active{background:var(--soft)}
html.lock,html.lock body{overflow:hidden}
#ops .op.off{opacity:.5;cursor:not-allowed}
#ops .op.off b{font-weight:600}
#ops .lk2{flex:none;color:var(--muted);display:grid;place-items:center;width:26px}
#ops .lnote{margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:var(--soft);color:var(--muted);font-size:13px;font-weight:600}
.limw{margin:8px 0 0;font-size:13px;font-weight:700;color:var(--bad,#b3261e)}
.pf h3{margin:0;font-size:18px}
.pfd{margin:4px 0 12px;color:var(--muted);font-size:14px}
.lims{display:grid;gap:8px}
.limr{border:1px solid var(--line);border-radius:14px;overflow:hidden}
.limr.on{border-color:var(--gold)}
.limb{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:10px 14px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.limb .lt{flex:1;min-width:0}
.limb b{display:block;font-size:16px}
.limb small{display:block;margin-top:2px;font-size:13px;font-weight:600;color:var(--muted)}
.limb .tg{flex:none;position:relative;width:50px;height:30px;border-radius:15px;background:var(--line);transition:background .18s}
.limb .tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s}
.limr.on .tg{background:var(--gold)}
.limr.on .tg::after{transform:translateX(20px)}
.limx{margin:0;padding:0 14px 12px;font-size:13px;color:var(--muted);line-height:1.5}
.pfn{margin:12px 0 0;font-size:13px;color:var(--muted)}
#ops{position:fixed;inset:0;z-index:40}
#ops .bd{position:absolute;inset:0;background:rgba(8,16,28,.5);opacity:0;transition:opacity .22s}
#ops .sh{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:min(80vh,680px);display:flex;flex-direction:column;background:var(--card);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.22);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
#ops.on .bd{opacity:1}
#ops.on .sh{transform:none}
#ops .hnd{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
#ops .shh{display:flex;align-items:center;gap:10px;padding:6px 10px 12px 20px;border-bottom:1px solid var(--line);flex:none}
#ops .hx{flex:1;min-width:0}
#ops h3{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
#ops .shh small{display:block;margin-top:2px;color:var(--muted);font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ops .x{flex:none;display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:var(--soft);color:var(--ink)}
#ops .ls{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 10px 16px}
#ops .gh{padding:16px 12px 6px;font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
#ops .op{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin:2px 0;padding:10px 12px;border:0;border-radius:14px;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;transition:background .12s}
#ops .op:active{background:var(--soft)}
#ops .op:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
#ops .op.on{background:var(--workbg)}
#ops .ot{flex:1;min-width:0}
#ops .op b{display:block;font-size:16px;font-weight:700;line-height:1.25}
#ops .op small{display:block;margin-top:3px;font-size:13px;font-weight:600;color:var(--muted)}
#ops .ck{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#142b45;visibility:hidden}
#ops .op.on .ck{visibility:visible}
@media(prefers-reduced-motion:reduce){#ops .sh,#ops .bd{transition:none}}
.in .lh{display:block;width:max-content;max-width:100%;box-sizing:border-box;overflow:hidden;text-overflow:ellipsis}
@media(max-width:360px){.in .lw{display:none}}
.eqs button{flex:1;min-height:40px;padding:0 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:700 14px/1 system-ui,sans-serif}
.eqs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
textarea#nt{width:100%;min-height:64px;font:inherit;font-size:15px;color:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:10px;resize:vertical}
.ntl{margin:8px 0 0;font-size:14px;color:var(--muted)}
